<!DOCTYPE html>
<html>

<head>
    <title>CDCS-EMP Login</title>
</head>

<body>

    <h2>Login</h2>

    <form method="POST">

        {{ form.hidden_tag() }}

        <p>
            {{ form.username.label }}
            {{ form.username() }}
        </p>

        <p>
            {{ form.password.label }}
            {{ form.password() }}
        </p>

        <p>
            {{ form.remember_me() }}
            {{ form.remember_me.label }}
        </p>

        <button type="submit">
            Login
        </button>

    </form>

</body>

</html>
