<nav id="sidebar" aria-label="Primary navigation" class="col-md-2 d-md-block bg-light border-end sidebar collapse show">

    <div class="position-sticky pt-3">

        <ul class="nav flex-column">

            {% for item in menu_items %}

            <li class="nav-item">

                {% if item.children %}

                <details {% if request.endpoint in item.children | map(attribute="endpoint" ) | list %} open {% endif
                    %}>

                    <summary class="nav-link">

                        <i class="bi {{ item.icon }}"></i>

                        {{ item.title }}

                    </summary>

                    <ul class="nav flex-column ms-3">

                        {% for child in item.children %}

                        <li class="nav-item">

                            <a class="nav-link {% if request.endpoint == child.endpoint %}active{% endif %}"
                                href="{{ url_for(child.endpoint) }}">
                                {{ child.title }}
                            </a>

                        </li>

                        {% endfor %}

                    </ul>

                </details>

                {% elif item.endpoint %}

                <a class="nav-link {% if request.endpoint == item.endpoint %}active{% endif %}"
                    href="{{ url_for(item.endpoint) }}">

                    <i class="bi {{ item.icon }}"></i>

                    {{ item.title }}

                </a>

                {% else %}

                <a class="nav-link disabled" href="#">

                    <i class="bi {{ item.icon }}"></i>

                    {{ item.title }}

                    <span class="badge bg-secondary ms-1">
                        Soon
                    </span>

                </a>

                {% endif %}

            </li>

            {% endfor %}

        </ul>

    </div>

</nav>
